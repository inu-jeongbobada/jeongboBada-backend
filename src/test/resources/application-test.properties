# 통합 테스트(@SpringBootTest로 실제 DB를 쓰는 테스트) 전용 설정.
# 테스트 클래스에 @ActiveProfiles("test")를 붙이면 이 파일이 적용된다.
#
# 왜 필요한가:
#   로컬 실행은 gitignore된 application.yml에서 설정을 읽지만, CI에는 그 파일이 없고
#   datasource 환경변수 3개(SPRING_DATASOURCE_URL/USERNAME/PASSWORD)만 주입된다.
#   그래서 테스트가 application.yml의 값에 기대면 "로컬은 통과, CI만 실패"가 된다.
#   테스트에 필요한 설정은 이 파일에 모아서 로컬과 CI가 같은 조건으로 돌게 한다.
#
# 주의:
#   - 확장자를 .yml로 바꾸지 말 것. .gitignore가 application-*.yml을 무시해서(DB 비밀번호 보호용 규칙)
#     새 파일이 커밋에서 조용히 빠진다. 로컬에서는 파일이 있어 통과하고 CI에서만 실패한다.
#   - 파일 이름을 application.properties로 바꾸지 말 것. 같은 이름이면 main 설정을 가려서 로컬 설정이 사라질 수 있다.
#   - datasource는 여기 두지 않는다. CI는 환경변수로, 로컬은 application.yml에서 받는다.
#   - 값은 전부 테스트 전용이다. 실제 시크릿을 넣지 말 것.

# CI의 MySQL은 빈 DB이고 MySQL 기본값은 none이라, 없으면 테이블이 안 만들어진다 (Table 'users' doesn't exist).
# create-drop은 쓰지 않는다: 로컬에서 개발용 DB에 붙으면 테스트가 끝날 때 테이블을 통째로 지운다.
spring.jpa.hibernate.ddl-auto=update

# 로그인(토큰 발급)이 필요한 테스트용. HS256은 32바이트 이상이어야 한다.
jwt.secret=integration-test-only-secret-key-that-is-at-least-32-bytes-long
jwt.expiration=3600000
jwt.refresh-expiration=1209600000
