name: CI

# main으로 가는 PR과 머지 결과를 검증한다.
# 목적은 "부팅되지 않는 코드가 main에 머지되는 것"을 막는 것이다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    # docker-compose.yml과 동일한 MySQL 8.4 컨테이너를 서비스로 띄워
    # @SpringBootTest 컨텍스트 로딩이 실제 DB에 붙을 수 있게 한다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: jeongbobada
          MYSQL_USER: jeongbobada
          MYSQL_PASSWORD: jeongbobada
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # application.yml은 gitignore 대상이라 CI 체크아웃본에는 없다.
    # 대신 환경변수로 datasource를 주입한다 (Spring relaxed binding).
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/jeongbobada
      SPRING_DATASOURCE_USERNAME: jeongbobada
      SPRING_DATASOURCE_PASSWORD: jeongbobada

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 바로 볼 수 있도록 리포트를 남긴다.
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
